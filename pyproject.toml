[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "llm_kit"
version = "0.1.1"
description = "Small, provider-agnostic chat-with-tools client (Anthropic / OpenAI / xAI) over raw httpx."
requires-python = ">=3.10"
dependencies = ["httpx>=0.27"]

[tool.setuptools]
packages = ["llm_kit"]
